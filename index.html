<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXXTOPIA</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reel.css">
    <link rel="stylesheet" href="css/animation.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <h1>HÔM NAY NGHE GÌ :3</h1>
                <p>ĐẠO HỮU XIN DỪNG BƯỚC</p>
            </div>
            
            <nav class="header-nav">
                <a href="#" class="github-link" target="_blank">
                    ⭐ Star on GitHub
                </a>
            </nav>
        </div>
    </header>


    <!-- =========================
         MODE SELECTOR (THỂ LOẠI NHẠC)
    ========================== -->
    <section class="mode-section">
        <button class="mode-btn active" data-mode="kpop">K-POP</button>
        <button class="mode-btn" data-mode="vpop">V-POP</button>
        <button class="mode-btn" data-mode="rapviet">VIET-RAP</button>
        <button class="mode-btn" data-mode="usuk">US-UK</button>
    </section>


    <!-- =========================
         CASE / REEL
    ========================== -->
    <main>
        <section class="case-container">
            <div class="pointer"></div>
            <div class="reel-window">
                <div id="reel" class="reel">
                    <!-- JS generate -->
                </div>
            </div>
        </section>


        <!-- =========================
             RANDOM BUTTON
        ========================== -->
        <div class="random-section">
            <button id="randomBtn" class="random-btn">
                🎲 ÚM BA LA XÌ BÙM
            </button>
        </div>


        <!-- =========================
             INVENTORY (SHOW ALL THẺ TRONG HÒM)
        ========================== -->
        <section class="inventory-section">
            <h2 class="section-title">Vật phẩm trong hòm</h2>
            <div id="inventory" class="inventory-grid">
                <!-- JS render tất cả bài hát -->
            </div>
        </section>
    </main>


    <!-- =========================
         RESULT MODAL (POP-UP GACHA)
    ========================== -->
    <div id="resultModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" type="button" aria-label="Đóng">&times;</button>
            <div class="modal-header">
                <span id="modalRarity" class="modal-rarity">RARITY</span>
            </div>

            <div class="modal-body">
                <img id="modalImage" src="" alt="Result Card">
                <h1 id="modalTitle">SONG TITLE</h1>
                <h2 id="modalSubtitle">GROUP NAME</h2>
            </div>

            <div class="modal-actions">
                <a id="modalLinkBtn" href="#" target="_blank" class="link-btn">
                    ▶ NGHE TRÊN YOUTUBE
                </a>
                <button id="acceptModalBtn" class="accept-btn" type="button">XÁC NHẬN</button>
            </div>
        </div>
    </div>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="app-footer">
        <div class="footer-container">
            <p>&copy; 2026 K-Pop Randomizer. All rights reserved.</p>
            
            <div class="footer-links">
                <a href="#">Về dự án</a>
                <a href="#">Đóng góp bài hát</a>
                <a href="#">Báo lỗi</a>
            </div>
            
            <p class="footer-subtext">Designed with 💖 for K-Pop fans.</p>
        </div>
    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="data/songs.js"></script>
    <script src="js/random.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/reel.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
